services:
  mongo:
    image: mongo:8.0
    container_name: clipper-mongo
    ports:
      - "27017:27017"
    environment:
      GLIBC_TUNABLES: "glibc.pthread.rseq=1"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.4-alpine
    container_name: clipper-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
